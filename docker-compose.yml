services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      PROJECTS_DIR: /Projects
      CORS_ORIGINS: http://localhost:5173
      BROWSER_PROFILE_DIR: /browser-profile
    volumes:
      - ./Projects:/Projects
      - ./browser-profile:/browser-profile
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on: [backend]
