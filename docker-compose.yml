services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PROJECTS_DIR: /Projects
      CORS_ORIGINS: http://localhost:5173
      BROWSER_PROFILE_DIR: /browser-profile
      BAMBULAB_TOKEN_FILE: /host-backend/.bambu_token
    volumes:
      - ./Projects:/Projects
      - ./browser-profile:/browser-profile
      - ./backend:/host-backend:ro
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on: [backend]
